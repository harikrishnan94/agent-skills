# Append to ~/.codex/config.toml to enable hooks/codex/session-scratchpad.sh.
# Codex reads inline [hooks] tables from config.toml (or a sibling hooks.json).
# `command` must point at the installed hook (symlinked into ~/.codex/hooks/).
# Also append hooks/codex/AGENTS.snippet.md to ~/.codex/AGENTS.md — the durable
# ingest half (AGENTS.md is Codex's global instruction file).

[[hooks.SessionStart]]
matcher = "startup|resume|compact"

[[hooks.SessionStart.hooks]]
type = "command"
command = "bash ~/.codex/hooks/session-scratchpad.sh"
statusMessage = "Loading session scratchpad"
